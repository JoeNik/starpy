# .github/workflows/build-arm64.yml
name: Build ARM64 Executable for CentOS 7
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
        
    - name: Build ARM64 executable for CentOS 7
      run: |
        docker run --rm --platform linux/arm64 \
          -v $PWD/backend:/workspace \
          -w /workspace \
          centos:7 \
          bash -c "
            yum -y update && \
            yum -y install epel-release && \
            yum -y install python36 python36-pip python36-devel gcc gcc-c++ && \
            alternatives --install /usr/bin/python3 python3 /usr/bin/python3.6 1 && \
            pip3.6 install --upgrade pip && \
            pip3.6 install -r requirements.txt pyinstaller && \
            python3.6 -m PyInstaller starpro-backend-arm64.spec
          "
          
    - name: Upload ARM64 executable
      uses: actions/upload-artifact@v4
      with:
        name: starpro-backend-arm64
        path: backend/dist/starpro-backend-arm64