# Alembic数据库迁移配置文件

[alembic]
# 迁移脚本存放路径
script_location = alembic

# 模板文件路径
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path directories, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# 时区设置
timezone = Asia/Shanghai

# 限制最大修订版本数
# max_length = 50

# 输出编码
output_encoding = utf-8

# 数据库连接URL (由env.py从环境变量读取)
# sqlalchemy.url = sqlite:///./storage/app/database.sqlite


[post_write_hooks]
# post_write_hooks定义代码格式化钩子
# 例如使用black格式化生成的迁移脚本
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S