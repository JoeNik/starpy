version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: starpy-backend
    volumes:
      - ./backend/storage:/app/storage
      - backend-db:/app/storage/app
    environment:
      - APP_ENV=production
      - TZ=Asia/Shanghai
      - DEBUG=false
      - DATABASE_URL=sqlite:///./storage/app/database.sqlite
      - CORS_ORIGINS=http://localhost:8008,http://localhost:5173
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: starpy-nginx
    ports:
      - "8008:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./backend/storage:/app/storage:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend-db:
    driver: local